[workspace]
resolver = "2"
members = [
    "crates/quub-primitives",
    "crates/quub-precompiles",
    "crates/quub-evm",
    "crates/quub-pool",
    "crates/quub-node",
    "crates/quub-consensus-op",
    "crates/quub-consensus-simplex",
    "crates/quub-rpc",
    "services/quub-policy",
    "services/quub-iso",
    "services/quub-evidence",
    "services/quub-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["fazeZERO"]
repository = "https://github.com/quub-fi/quub"

[workspace.dependencies]
alloy-primitives = { version = "0.8", default-features = false, features = ["std"] }
alloy-sol-types = { version = "0.8", default-features = false, features = ["std"] }
quub-primitives = { path = "crates/quub-primitives" }
quub-precompiles = { path = "crates/quub-precompiles" }
quub-evm = { path = "crates/quub-evm" }
quub-pool = { path = "crates/quub-pool" }
quub-consensus-op = { path = "crates/quub-consensus-op" }
quub-consensus-simplex = { path = "crates/quub-consensus-simplex" }
thiserror = "2"
# ADR-016: one Reth remote. Do not override revm past this rev. No [patch] second Reth.
reth-ethereum = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", default-features = false }
# ADR-016 pin: op-reth/v2.4.4. Path = local checkout of that tag (commit 7e167ae / aef8d3ef Reth).
# Swap to `git = "…", tag = "op-reth/v2.4.4"` when the monorepo fetch is reliable.
reth-optimism-node = { path = "/tmp/optimism-op-node/rust/op-reth/crates/node" }
reth-optimism-evm = { path = "/tmp/optimism-op-node/rust/op-reth/crates/evm", default-features = false, features = ["std"] }
reth-optimism-chainspec = { path = "/tmp/optimism-op-node/rust/op-reth/crates/chainspec", default-features = false, features = ["std"] }
reth-optimism-primitives = { path = "/tmp/optimism-op-node/rust/op-reth/crates/primitives", default-features = false, features = ["std"] }
reth-optimism-forks = { path = "/tmp/optimism-op-node/rust/op-reth/crates/hardforks", default-features = false }

[profile.dev]
debug = 0
