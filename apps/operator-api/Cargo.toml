[package]
name = "quub-operator-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Quub operator HTTP API — eth_* gateway for payments and freeze"
publish = false

[[bin]]
name = "quub-operator-api"
path = "src/main.rs"

[dependencies]
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types = { workspace = true }
quub-primitives = { workspace = true }
quub-iso = { path = "../../services/quub-iso" }
thiserror = { workspace = true }

# HTTP + signing on the primitives (0.8) line — no reth-*, no alloy 1.x/2.x provider stack.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
k256 = { version = "0.13", features = ["ecdsa", "std"] }
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
